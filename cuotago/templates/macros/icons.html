{% macro icon(name, size=28) -%}
<svg class="ui-icon" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" aria-hidden="true">
  {% if name == 'plus-doc' %}
    <path d="M7 3.5h7l3.5 3.5v13.5H7z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M14 3.5V7h3.5M12 10.5v6M9 13.5h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
  {% elif name == 'wallet' %}
    <path d="M4 7.5h14.5A1.5 1.5 0 0 1 20 9v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M15 11h5v4h-5a2 2 0 1 1 0-4Z" stroke="currentColor" stroke-width="1.8"/>
  {% elif name == 'users' %}
    <circle cx="9" cy="8" r="3" stroke="currentColor" stroke-width="1.8"/>
    <path d="M3.5 19c.4-4 2.4-6 5.5-6s5.1 2 5.5 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M15 6.2c2.1.1 3.5 1.5 3.5 3.3s-1.4 3.2-3.5 3.3M16 14c2.8.4 4.2 2 4.5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
  {% elif name == 'box' %}
    <path d="M4 7.5 12 3l8 4.5v9L12 21l-8-4.5z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="m4.5 7.8 7.5 4.3 7.5-4.3M12 12v8.6" stroke="currentColor" stroke-width="1.8"/>
  {% elif name == 'contract' %}
    <path d="M6 3h8l4 4v14H6z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M14 3v4h4M9 11h6M9 15h6M9 19h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
  {% elif name == 'calendar' %}
    <rect x="3.5" y="5.5" width="17" height="15" rx="2" stroke="currentColor" stroke-width="1.8"/>
    <path d="M7 3v5M17 3v5M3.5 10h17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M8 14h2v2H8zM14 14h2v2h-2z" fill="currentColor"/>
  {% elif name == 'chart' %}
    <path d="M4 20V5M4 20h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    <path d="m7 16 4-5 3 2 5-7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M17 6h2v2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
  {% elif name == 'settings' %}
    <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/>
    <path d="M19 13.5v-3l-2-.7a6 6 0 0 0-.8-1.8l.9-1.9L15 4l-1.9.9a6 6 0 0 0-2.2 0L9 4 6.9 6.1 7.8 8A6 6 0 0 0 7 9.8l-2 .7v3l2 .7a6 6 0 0 0 .8 1.8l-.9 1.9L9 20l1.9-.9a6 6 0 0 0 2.2 0L15 20l2.1-2.1-.9-1.9a6 6 0 0 0 .8-1.8z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
  {% elif name == 'home' %}
    <path d="m3 11 9-7 9 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M5 10v10h14V10M9 20v-6h6v6" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
  {% elif name == 'phone' %}
    <rect x="7" y="2.5" width="10" height="19" rx="2.2" stroke="currentColor" stroke-width="1.8"/>
    <path d="M10 5h4M11 18.5h2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
  {% elif name == 'car' %}
    <path d="M5 11 7 6h10l2 5" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M4 11h16v6H4z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
    <circle cx="7" cy="17.5" r="1.5" fill="currentColor"/><circle cx="17" cy="17.5" r="1.5" fill="currentColor"/>
  {% elif name == 'back' %}
    <path d="m14 6-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  {% elif name == 'search' %}
    <circle cx="10.5" cy="10.5" r="6.5" stroke="currentColor" stroke-width="1.8"/><path d="m15.5 15.5 4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
  {% elif name == 'bell' %}
    <path d="M6 17h12l-1.5-2.5V10a4.5 4.5 0 1 0-9 0v4.5z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M10 19a2 2 0 0 0 4 0" stroke="currentColor" stroke-width="1.8"/>
  {% elif name == 'sun' %}
    <circle cx="12" cy="12" r="3.5" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M18.7 5.3l-1.4 1.4M6.7 17.3l-1.4 1.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
  {% elif name == 'moon' %}
    <path d="M19.4 15.2A8 8 0 0 1 8.8 4.6 8.3 8.3 0 1 0 19.4 15.2Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
  {% elif name == 'download' %}
    <path d="M12 3v11M8 10l4 4 4-4M5 19h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  {% elif name == 'logout' %}
    <path d="M10 4H5v16h5M14 8l4 4-4 4M8 12h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  {% elif name == 'shield' %}
    <path d="M12 3 19 6v5.2c0 4.3-2.7 7.8-7 9.8-4.3-2-7-5.5-7-9.8V6z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="m9.2 12 1.8 1.8 3.8-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  {% elif name == 'refresh' %}
    <path d="M19 8a7 7 0 1 0 1 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M19 4v4h-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  {% elif name == 'trash' %}
    <path d="M5 7h14M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  {% elif name == 'offline' %}
    <path d="M4.5 9a11 11 0 0 1 15 0M7.5 12.2a6.8 6.8 0 0 1 7.8-.6M10.5 16a2.5 2.5 0 0 1 3 0M3 3l18 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
  {% else %}
    <circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.8"/><path d="M12 8v5M12 16.5v.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
  {% endif %}
</svg>
{%- endmacro %}
