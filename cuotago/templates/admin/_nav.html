{% set summary_active = request.endpoint in ['admin.dashboard','admin.create_company','admin.organization_detail'] %}
<nav class="admin-nav" aria-label="Administración">
  <a class="{{ 'is-active' if summary_active else '' }}" href="{{ url_for('admin.dashboard') }}">Resumen</a>
  <a class="{{ 'is-active' if request.endpoint == 'admin.plans' else '' }}" href="{{ url_for('admin.plans') }}">Planes</a>
  <a class="{{ 'is-active' if request.endpoint == 'admin.activity' else '' }}" href="{{ url_for('admin.activity') }}">Actividad</a>
</nav>
