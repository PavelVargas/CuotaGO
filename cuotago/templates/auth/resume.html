{% extends 'base.html' %}
{% block title %}Continuar · {{ app_name }}{% endblock %}
{% block content %}
<section class="auth-card resume-card">
  <div class="resume-brand resume-brand-modern">
    <img class="resume-brand-logo brand-logo-light" src="{{ url_for('static', filename='icons/logo-full-light.png') }}?v=brand-minimal-v2" alt="{{ app_name }}">
    <img class="resume-brand-logo brand-logo-dark" src="{{ url_for('static', filename='icons/logo-full-dark.png') }}?v=brand-minimal-v2" alt="{{ app_name }}">
  </div>

  <div class="resume-account" aria-label="Cuenta recordada">
    <div><strong>{{ current_user.name }}</strong></div>
  </div>

  <form method="post" class="resume-actions">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="next" value="{{ next_url or '' }}">
    <button class="btn btn-primary btn-lg btn-block" type="submit">Continuar con esta cuenta</button>
  </form>

  <form method="post" action="{{ url_for('auth.logout') }}" class="resume-other-account">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <button class="btn btn-ghost btn-block" type="submit">Iniciar con otra cuenta</button>
  </form>
</section>
{% endblock %}
